name: 刷新分红快照（股票 + 基金）

on:
  schedule:
    - cron: '0 18 * * *'   # 每天 UTC 18:00 = 北京时间 02:00
  workflow_dispatch: {}    # 支持手动触发

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 抓取股票分红快照（全量重抓，捕捉新公告）
        env:
          GH_ACTIONS: '1'
        run: node fetch_my_stocks.js

      - name: 抓取基金分红快照（ETF/LOF，含权益登记日/除息日/发放日）
        run: node fetch_fund_dividends.js

      - name: 提交更新
        id: commit
        run: |
          git config user.name "dividend-bot"
          git config user.email "bot@users.noreply.github.com"
          git add stock_dividends.json fund_dividends.json
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: 自动刷新分红快照 $(date +%F)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # 关键：用 GITHUB_TOKEN 提交不会触发 Cloudflare Pages 的 Git 集成构建，
      # 因此 pages.dev 上的 stock_dividends.json / calendar.html 会长期冻结在旧版本，
      # 页面只能靠 GitHub raw 补数据（国内常不可达）—— 这就是分红 chips 消失的上游原因。
      # 下面用 Deploy Hook 主动触发一次部署，让部署资产跟上每日刷新。
      - name: 触发 Cloudflare Pages 重新部署
        if: ${{ steps.commit.outputs.changed == 'true' && env.CF_PAGES_DEPLOY_HOOK != '' }}
        env:
          CF_PAGES_DEPLOY_HOOK: ${{ secrets.CF_PAGES_DEPLOY_HOOK }}
        run: curl -fsS -X POST "$CF_PAGES_DEPLOY_HOOK"

      - name: 未配置部署钩子的提示
        if: ${{ steps.commit.outputs.changed == 'true' && env.CF_PAGES_DEPLOY_HOOK == '' }}
        env:
          CF_PAGES_DEPLOY_HOOK: ${{ secrets.CF_PAGES_DEPLOY_HOOK }}
        run: |
          echo "::warning::未配置 CF_PAGES_DEPLOY_HOOK，pages.dev 的快照不会自动更新（页面会回退到 GitHub raw）"
